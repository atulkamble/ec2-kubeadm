apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-per-node
spec:
  selector:
    matchLabels:
      app: nginx-per-node
  template:
    metadata:
      labels:
        app: nginx-per-node
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
